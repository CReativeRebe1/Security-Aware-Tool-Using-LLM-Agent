<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate · Focus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%23a78bfa'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<div class="top">
  <div class="logo"><b></b>Gate<span style="color:var(--dim);font-weight:600">focus</span></div>
  <div class="pill"><select id="batch" title="Batch"></select><span id="role" class="role"></span></div>
  <button class="ghost" id="btnPolicy" title="Policy documents (/)">Policies</button>
  <div class="spacer"></div>
  <span class="save" id="save"><i></i><span>—</span></span>
  <div class="count"><span id="pos">–</span> <small id="done"></small></div>
  <div class="me" id="me" title="Switch annotator"><span id="avatar">?</span><b id="who">–</b></div>
</div>
<div class="ticks" id="ticks"></div>

<div class="stage">
  <button class="nav prev" id="prev" title="Previous (←)">‹</button>
  <article class="card" id="card"></article>
  <button class="nav next" id="next" title="Next (→)">›</button>
</div>

<div class="dock-wrap">
  <div class="sheet hidden" id="sheet"></div>
  <div class="dock" id="dock">
    <button class="ALLOW" data-d="ALLOW"><span class="ic">✓</span><b>Allow</b><kbd>1</kbd></button>
    <button class="BLOCK" data-d="BLOCK"><span class="ic">✕</span><b>Block</b><kbd>2</kbd></button>
    <button class="ASK_USER" data-d="ASK_USER"><span class="ic">?</span><b>Ask user</b><kbd>3</kbd></button>
    <button class="ESCALATE" data-d="ESCALATE"><span class="ic">↑</span><b>Escalate</b><kbd>4</kbd></button>
  </div>
  <div class="hint"><kbd>1</kbd>–<kbd>4</kbd> decide · <kbd>←</kbd><kbd>→</kbd> move · <kbd>U</kbd> next unlabelled · <kbd>E</kbd> evidence · <kbd>/</kbd> policies · <kbd>Enter</kbd> done</div>
</div>

<div class="drawer-wrap hidden" id="drawer">
  <aside class="drawer">
    <h3>Policy documents <small id="polCount"></small><button class="ghost" id="closeDrawer">Close</button></h3>
    <input class="search" id="q" placeholder="Search clauses by id, title or text">
    <div class="results" id="results"></div>
  </aside>
</div>

<div class="overlay hidden" id="whoDlg"><div class="modal"><h2>Who's labelling?</h2>
  <p>Your votes are saved under your name. Nobody else can change them, and you can't change theirs.</p>
  <div class="people" id="people"></div></div></div>

<script src="app.js"></script>
</body>
</html>

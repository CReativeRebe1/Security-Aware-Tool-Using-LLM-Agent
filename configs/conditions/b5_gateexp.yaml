name: b5_gateexp
gate: {kind: llm, adapter: adapters/b5_qlora_4way}   # existing B5 adapter, no retraining (docs/GATE_EVALUATION.md §3)
decision_space: [ALLOW, BLOCK, ASK_USER, ESCALATE]
evidence: {provenance: oracle, authority: true, sensitivity: true, rag: true}
supervision: {intermediate: true}
resolution: {enabled: true}
# Deterministic layers around the model (sagate.gate.gateexp). The guards run inside `post`.
gateexp:
  pre: [declined, credential_flow, untrusted_provenance, authority]
  post: [guards, no_reescalate, no_reask, intent_confirm, new_payee_confirm, amount_confirm, unlabelled_external, route_authority]
  show_facts: true        # the model sees the new CHECKS lines (user_intent, risk, data_source, split, data_label)

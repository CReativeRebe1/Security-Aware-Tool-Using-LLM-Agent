<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate · Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%2334d399'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<div class="top">
  <div class="logo"><b></b>Gate<span style="color:var(--dim);font-weight:600">review</span></div>
  <div class="pill"><select id="batch" title="Batch"></select><span id="role" class="role"></span></div>
  <div class="spacer"></div>
  <div class="counts" id="counts"></div>
  <div class="navbtns"><button id="prev" title="Previous (←)">‹</button><button id="next" title="Next (→)">›</button></div>
  <div class="count"><span id="pos">–</span></div>
  <div class="me" id="me" title="Switch reviewer"><span id="avatar">?</span><b id="who">–</b></div>
</div>
<div class="ticks" id="ticks"></div>

<div class="layout">
  <section class="left">
    <article class="card" id="card"></article>
  </section>
  <section class="right">
    <div class="ev tools"><div class="k">Tool outputs (untrusted)</div><div class="body" id="evTools"></div></div>
    <div class="ev policy"><div class="k">Retrieved policy</div><div class="body" id="evPolicy"></div></div>
  </section>
  <section class="reviewcol">
    <div class="panel" id="panel"></div>
  </section>
</div>
<div class="overlay hidden" id="fullDlg"><div class="modal wide"><h2 style="margin-top:0">Tool outputs</h2><div id="fullText"></div>
  <p style="text-align:right;margin:12px 0 0"><button class="act ghost" id="closeFull">Close <kbd>Esc</kbd></button></p></div></div>
<div class="hint" style="text-align:center;padding-bottom:8px"><kbd>A</kbd> accept · <kbd>R</kbd> edit · <kbd>C</kbd> can't label ·
  <kbd>←</kbd><kbd>→</kbd> move · <kbd>Esc</kbd> cancel</div>

<div class="overlay hidden" id="whoDlg"><div class="modal"><h2>Who's reviewing?</h2>
  <p>Your reviews are saved under your name.</p><div class="people" id="people"></div></div></div>

<script src="app.js"></script>
</body>
</html>

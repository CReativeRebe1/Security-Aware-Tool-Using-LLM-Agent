<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a66"/>
      <stop offset="1" stop-color="#14284a"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#3d5afe"/>
    </linearGradient>
    <linearGradient id="ctx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173055"/>
      <stop offset="1" stop-color="#112441"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00bfa5"/>
      <stop offset="1" stop-color="#00897b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5c7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5c7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb4d9"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffca28"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1400" height="860" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#9fb4d9">
    <path d="M0 120 H1400 M0 240 H1400 M0 360 H1400 M0 480 H1400 M0 600 H1400 M0 720 H1400"/>
    <path d="M140 0 V860 M280 0 V860 M420 0 V860 M560 0 V860 M700 0 V860 M840 0 V860 M980 0 V860 M1120 0 V860 M1260 0 V860"/>
  </g>
  <circle cx="790" cy="420" r="330" fill="url(#glow)"/>

  <!-- title -->
  <text x="60" y="62" font-size="30" font-weight="700" fill="#ffffff">Security gate for a tool-using LLM agent</text>
  <text x="60" y="94" font-size="16" fill="#9fb4d9">Every state-changing tool call is checked before it runs: allow it, block it, ask the user, or escalate to an approver.</text>

  <!-- ========== column 1: user + agent ========== -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="230" height="300" rx="22" fill="#132643" stroke="#2c4a7a"/>
  </g>
  <!-- user icon -->
  <circle cx="165" cy="205" r="22" fill="#ffca28"/>
  <path d="M127 262 q38 -42 76 0 v6 h-76 z" fill="#ffca28"/>
  <text x="165" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">User request</text>
  <text x="165" y="316" text-anchor="middle" font-size="12.5" fill="#9fb4d9">"Pay the bill in bill.txt"</text>
  <!-- agent icon -->
  <rect x="133" y="338" width="64" height="48" rx="12" fill="url(#agent)"/>
  <circle cx="152" cy="360" r="6" fill="#0f1b2d"/>
  <circle cx="178" cy="360" r="6" fill="#0f1b2d"/>
  <rect x="155" y="372" width="20" height="4" rx="2" fill="#0f1b2d"/>
  <line x1="165" y1="338" x2="165" y2="326" stroke="#00bfa5" stroke-width="3"/>
  <circle cx="165" cy="323" r="4" fill="#00bfa5"/>
  <text x="165" y="410" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Agent (Qwen3-8B)</text>
  <text x="165" y="430" text-anchor="middle" font-size="12.5" fill="#9fb4d9">proposes send_money(…)</text>

  <!-- arrow agent -> context -->
  <path d="M285 300 C 310 300, 315 300, 338 300" stroke="#9fb4d9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== column 2: evidence ========== -->
  <g filter="url(#shadow)">
    <rect x="345" y="150" width="250" height="430" rx="22" fill="url(#ctx)" stroke="#2c4a7a"/>
  </g>
  <text x="470" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Evidence</text>
  <text x="470" y="206" text-anchor="middle" font-size="12" fill="#9fb4d9">built from the live conversation</text>
  <!-- chips -->
  <g font-size="13.5" fill="#fff">
    <rect x="368" y="226" width="204" height="54" rx="12" fill="#1c3a66"/>
    <circle cx="394" cy="253" r="13" fill="#26c6da"/><path d="M388 253 l5 5 l8 -10" stroke="#0f1b2d" stroke-width="3" fill="none"/>
    <text x="416" y="249" font-weight="600">Provenance</text><text x="416" y="267" font-size="11.5" fill="#9fb4d9">user, tool output or injected?</text>

    <rect x="368" y="290" width="204" height="54" rx="12" fill="#1c3a66"/>
    <circle cx="394" cy="317" r="13" fill="#ffca28"/><path d="M387 322 h14 v-7 h-14 z M390 315 v-4 a4 4 0 0 1 8 0 v4" stroke="#0f1b2d" stroke-width="2.2" fill="none"/>
    <text x="416" y="313" font-weight="600">Authority</text><text x="416" y="331" font-size="11.5" fill="#9fb4d9">may the user approve this?</text>

    <rect x="368" y="354" width="204" height="54" rx="12" fill="#1c3a66"/>
    <circle cx="394" cy="381" r="13" fill="#ef5350"/><text x="394" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">C</text>
    <text x="416" y="377" font-weight="600">Sensitivity</text><text x="416" y="395" font-size="11.5" fill="#9fb4d9">data label → destination</text>

    <rect x="368" y="418" width="204" height="54" rx="12" fill="#1c3a66"/>
    <circle cx="394" cy="445" r="13" fill="#66bb6a"/><path d="M387 439 h14 M387 445 h14 M387 451 h9" stroke="#0f1b2d" stroke-width="2.4"/>
    <text x="416" y="441" font-weight="600">Policy clauses</text><text x="416" y="459" font-size="11.5" fill="#9fb4d9">retrieved from the handbook</text>

    <rect x="368" y="482" width="204" height="54" rx="12" fill="#1c3a66"/>
    <circle cx="394" cy="509" r="13" fill="#ab47bc"/><path d="M394 501 v8 l6 4" stroke="#0f1b2d" stroke-width="2.6" fill="none"/>
    <text x="416" y="505" font-weight="600">History</text><text x="416" y="523" font-size="11.5" fill="#9fb4d9">earlier questions and answers</text>
  </g>

  <!-- arrow context -> gate -->
  <path d="M600 365 C 625 365, 630 365, 652 365" stroke="#9fb4d9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== column 3: GateExp ========== -->
  <g filter="url(#shadow)">
    <rect x="660" y="135" width="370" height="560" rx="26" fill="url(#gate)" stroke="#5c7cff" stroke-width="2"/>
  </g>
  <!-- shield badge -->
  <path d="M845 112 l34 12 v24 c0 22 -16 36 -34 44 c-18 -8 -34 -22 -34 -44 v-24 z" fill="#5c7cff" stroke="#c5d2ff" stroke-width="2"/>
  <path d="M831 150 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="845" y="222" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">GateExp gate</text>

  <!-- layer 1 -->
  <rect x="690" y="240" width="310" height="70" rx="14" fill="#203f6e"/>
  <text x="712" y="266" font-size="12" font-weight="700" fill="#26c6da">1 · FACTS &amp; LEDGER</text>
  <text x="712" y="286" font-size="12.5" fill="#dbe4f5">intent, risk, data source, payment totals,</text>
  <text x="712" y="302" font-size="12.5" fill="#dbe4f5">which call each "yes" was about</text>
  <!-- layer 2 -->
  <rect x="690" y="322" width="310" height="70" rx="14" fill="#203f6e"/>
  <text x="712" y="348" font-size="12" font-weight="700" fill="#ffca28">2 · RULES BEFORE THE MODEL</text>
  <text x="712" y="368" font-size="12.5" fill="#dbe4f5">declined · credentials · injected source ·</text>
  <text x="712" y="384" font-size="12.5" fill="#dbe4f5">authority (confirm first, then escalate)</text>
  <!-- layer 3: model -->
  <rect x="690" y="404" width="310" height="92" rx="14" fill="url(#model)"/>
  <!-- brain-ish icon -->
  <g transform="translate(722 450)">
    <circle r="22" fill="#ffffff" opacity="0.18"/>
    <path d="M-10 -8 q-8 0 -8 8 q0 8 8 8 M10 -8 q8 0 8 8 q0 8 -8 8 M-10 -8 q0 -8 10 -8 q10 0 10 8 M-10 8 q0 8 10 8 q10 0 10 -8 M0 -16 v32" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="756" y="434" font-size="12" font-weight="700" fill="#ffffff">3 · LEARNED MODEL</text>
  <text x="756" y="455" font-size="14" font-weight="600" fill="#ffffff">Qwen3-8B + QLoRA (b5_v3_combo)</text>
  <text x="756" y="476" font-size="12.5" fill="#e8e3ff">reads call + evidence + facts → 1 of 4</text>
  <!-- layer 4 -->
  <rect x="690" y="508" width="310" height="70" rx="14" fill="#203f6e"/>
  <text x="712" y="534" font-size="12" font-weight="700" fill="#66bb6a">4 · CHECKS AFTER THE MODEL</text>
  <text x="712" y="554" font-size="12.5" fill="#dbe4f5">new payee · amount · intent · unknown args ·</text>
  <text x="712" y="570" font-size="12.5" fill="#dbe4f5">route to approver (only ever stricter)</text>
  <!-- layer 5 -->
  <rect x="690" y="590" width="310" height="80" rx="14" fill="#1a3359" stroke="#2c4a7a"/>
  <text x="712" y="616" font-size="12" font-weight="700" fill="#ab47bc">5 · DECISION LOG</text>
  <text x="712" y="636" font-size="12.5" fill="#dbe4f5">facts, every rule step and the model's</text>
  <text x="712" y="652" font-size="12.5" fill="#dbe4f5">own answer, for fault attribution</text>
  <!-- down arrows between layers -->
  <g stroke="#9fb4d9" stroke-width="2.4" marker-end="url(#arrow)">
    <line x1="845" y1="310" x2="845" y2="320"/>
    <line x1="845" y1="392" x2="845" y2="402"/>
    <line x1="845" y1="496" x2="845" y2="506"/>
  </g>

  <!-- arrows gate -> outcomes -->
  <g stroke="#9fb4d9" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M1035 300 C 1070 300, 1070 215, 1098 215"/>
    <path d="M1035 360 C 1070 360, 1070 335, 1098 335"/>
    <path d="M1035 420 C 1070 420, 1070 455, 1098 455"/>
    <path d="M1035 480 C 1070 480, 1070 575, 1098 575"/>
  </g>

  <!-- ========== column 4: outcomes ========== -->
  <g filter="url(#shadow)">
    <rect x="1105" y="170" width="250" height="92" rx="18" fill="#123a2b" stroke="#2e7d5b"/>
    <rect x="1105" y="290" width="250" height="92" rx="18" fill="#3a1717" stroke="#8e2c2c"/>
    <rect x="1105" y="410" width="250" height="92" rx="18" fill="#3a3013" stroke="#8a6d1f"/>
    <rect x="1105" y="530" width="250" height="92" rx="18" fill="#2a1a40" stroke="#6a3fa0"/>
  </g>
  <!-- allow -->
  <circle cx="1148" cy="216" r="22" fill="#43a047"/>
  <path d="M1137 216 l8 8 l15 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1182" y="210" font-size="17" font-weight="700" fill="#a5e8c4">ALLOW</text>
  <text x="1182" y="232" font-size="12.5" fill="#cfe9dc">the call runs</text>
  <!-- block -->
  <circle cx="1148" cy="336" r="22" fill="#e53935"/>
  <path d="M1139 327 l18 18 M1157 327 l-18 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="1182" y="330" font-size="17" font-weight="700" fill="#ffb4ae">BLOCK</text>
  <text x="1182" y="352" font-size="12.5" fill="#f2cfcc">"Action not permitted."</text>
  <!-- ask -->
  <circle cx="1148" cy="456" r="22" fill="#ffb300"/>
  <text x="1148" y="465" text-anchor="middle" font-size="24" font-weight="800" fill="#3a3013">?</text>
  <text x="1182" y="450" font-size="17" font-weight="700" fill="#ffe08a">ASK_USER</text>
  <text x="1182" y="472" font-size="12.5" fill="#efe2bd">confirm payee, amount, intent</text>
  <!-- escalate -->
  <circle cx="1148" cy="576" r="22" fill="#8e5bd8"/>
  <path d="M1148 588 v-22 M1139 574 l9 -9 l9 9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1182" y="570" font-size="17" font-weight="700" fill="#d7c2ff">ESCALATE</text>
  <text x="1182" y="592" font-size="12.5" fill="#ddd2f2">manager, owner, security desk</text>

  <!-- resolution loop -->
  <path d="M1230 628 C 1230 760, 900 770, 860 700" stroke="#ffca28" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrowGold)"/>
  <rect x="930" y="722" width="250" height="44" rx="22" fill="#2b2a17" stroke="#ffca28"/>
  <text x="1055" y="740" text-anchor="middle" font-size="13" font-weight="600" fill="#ffe08a">answer → decide again</text>
  <text x="1055" y="757" text-anchor="middle" font-size="11.5" fill="#efe2bd">at most 2 rounds, then BLOCK</text>

  <!-- results strip -->
  <g filter="url(#shadow)">
    <rect x="50" y="620" width="545" height="180" rx="22" fill="#132643" stroke="#2c4a7a"/>
  </g>
  <text x="76" y="656" font-size="16" font-weight="700" fill="#fff">Results</text>
  <g>
    <text x="76" y="706" font-size="34" font-weight="800" fill="#66bb6a">0/120</text>
    <text x="76" y="730" font-size="12.5" fill="#9fb4d9">AgentDojo attacks succeeded</text>
    <text x="76" y="748" font-size="12.5" fill="#9fb4d9">(no gate: 10/120)</text>

    <text x="262" y="706" font-size="34" font-weight="800" fill="#26c6da">35.2%</text>
    <text x="262" y="730" font-size="12.5" fill="#9fb4d9">AgentDojo utility</text>
    <text x="262" y="748" font-size="12.5" fill="#9fb4d9">(no gate: 34.5%)</text>

    <text x="430" y="706" font-size="34" font-weight="800" fill="#ffca28">0%</text>
    <text x="430" y="730" font-size="12.5" fill="#9fb4d9">unsafe actions on</text>
    <text x="430" y="748" font-size="12.5" fill="#9fb4d9">dev and attack sets</text>
  </g>
  <text x="76" y="784" font-size="11.5" fill="#7d93b8">Banking + workspace suites · 142 test scenarios · simulated user with 15% wrong answers</text>
</svg>

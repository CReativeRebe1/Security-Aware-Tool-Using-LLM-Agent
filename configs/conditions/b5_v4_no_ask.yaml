name: b5_v4_no_ask
gate: {kind: llm, adapter: adapters/b5_v4_no_ask}   # ablation: no ASK_USER
decision_space: [ALLOW, BLOCK, ESCALATE]
evidence: {provenance: oracle, authority: true, sensitivity: true, rag: true, history: in_space}   # keeps pre-answered rounds of the decisions it still has
supervision: {intermediate: true}
resolution: {enabled: true}
train:
  epochs: 1
  extra_cases: [annotations/train_combos.jsonl]   # NB03 adds these to this condition's SFT data only
  lora_dropout: 0.1
  gateexp_facts: true
  # no per-class weights: every example counts the same in the token loss; the cost of a wrong decision is set by
  # the cost matrix below (gold -> predicted), added as the expected cost over the 4 decision tokens
  cost_matrix:
    ALLOW:    {ALLOW: 0.0, BLOCK: 1.0, ASK_USER: 0.5, ESCALATE: 0.5}   # over-blocking hurts more than one question
    BLOCK:    {ALLOW: 5.0, BLOCK: 0.0, ASK_USER: 0.5, ESCALATE: 0.5}   # unsafe action executed
    ASK_USER: {ALLOW: 3.0, BLOCK: 0.5, ASK_USER: 0.0, ESCALATE: 0.3}   # acted without the user's confirmation
    ESCALATE: {ALLOW: 5.0, BLOCK: 0.5, ASK_USER: 0.5, ESCALATE: 0.0}   # acted without the required approval
  cost_lambda: 1.0
  decision_smoothing: 0.1    # label smoothing on the decision only (against over-confidence)
  group_weights: true        # adaptive weights per group (suite x gold decision x origin): the weak groups count more
  group_eta: 1.0
